<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Chat & Preview</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .chat-box img { max-width: 100%; height: auto; }
        .chat-box pre { background: #1e1e1e; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; margin: 10px 0; }
        .chat-box code { font-family: monospace; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col m-0 p-0 font-sans">

    <!-- Header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-emerald-400">⚡ Free OpenRouter Chat</h1>
        <div class="text-xs bg-gray-700 px-3 py-1 rounded text-gray-300">Model: OpenRouter Free Auto</div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Chat Side (Left) -->
        <div class="flex-1 flex flex-col border-r border-gray-700 bg-gray-900">
            <div id="chatBox" class="chat-box flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Welcome Message -->
                <div class="bg-gray-800 p-3 rounded-lg max-w-2xl border border-gray-700">
                    <p class="text-emerald-400 font-bold mb-1">System:</p>
                    <p>Welcome! This chat is completely free. Paste HTML/CSS/JS code to preview it instantly in the right panel.</p>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="p-4 bg-gray-800 border-t border-gray-700 flex gap-2">
                <textarea id="userInput" rows="2" class="flex-1 bg-gray-700 text-white rounded p-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 placeholder-gray-400" placeholder="Type your message here..."></textarea>
                <button id="sendBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 rounded transition shadow-lg">Send</button>
            </div>
        </div>

        <!-- Preview / Artifacts Side (Right) -->
        <div class="w-1/2 flex flex-col bg-gray-900">
            <div class="bg-gray-800 p-2 border-b border-gray-700 font-bold text-sm text-gray-300 flex justify-between items-center">
                <span>🖥️ Code Artifact Live Preview</span>
                <button onclick="clearPreview()" class="text-xs text-red-400 hover:underline">Clear</button>
            </div>
            <iframe id="previewFrame" class="flex-1 bg-white border-none m-0 p-0 w-full h-full"></iframe>
        </div>

    </div>

    <script>
        // CONFIGURATION: Paste your OpenRouter API Key directly here
        const OPENROUTER_API_KEY = "PASTE_YOUR_OPENROUTER_KEY_HERE";
        
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const previewFrame = document.getElementById('previewFrame');

        let conversationHistory = [
            { role: "system", content: "You are a helpful AI assistant. If asked to write HTML, CSS, or JavaScript code, format it inside standard markdown code blocks." }
        ];

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Render User Message
            appendMessage('user', text);
            userInput.value = '';
            conversationHistory.push({ role: 'user', content: text });

            // Create placeholder for AI response
            const aiMessageId = appendMessage('assistant', 'Thinking...');
            const aiMessageDiv = document.getElementById(aiMessageId);

            try {
                const response = await fetch("https://openrouter.ai", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openrouter/free", // Forces OpenRouter's free router model selection
                        messages: conversationHistory
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;

                // Update AI Message with Markdown formatting
                aiMessageDiv.innerHTML = `<p class="text-emerald-400 font-bold mb-1">AI:</p><div>${marked.parse(reply)}</div>`;
                conversationHistory.push({ role: 'assistant', content: reply });
                chatBox.scrollTop = chatBox.scrollHeight;

                // Extract code blocks to render into the preview panel (Artifacts feature)
                extractAndPreviewCode(reply);

            } catch (error) {
                aiMessageDiv.innerHTML = `<p class="text-red-400 font-bold">Error:</p><p class="text-red-300">Failed to communicate with OpenRouter. Check your API key.</p>`;
            }
        }

        function appendMessage(sender, text) {
            const id = 'msg-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = `p-3 rounded-lg max-w-2xl border ${sender === 'user' ? 'bg-gray-800 border-gray-600 ml-auto' : 'bg-gray-800 border-gray-700'}`;
            msgDiv.innerHTML = `<p class="${sender === 'user' ? 'text-blue-400' : 'text-emerald-400'} font-bold mb-1">${sender === 'user' ? 'You' : 'AI'}:</p><div>${text}</div>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function extractAndPreviewCode(text) {
            // Regex to find HTML/Code inside markdown blocks
            const htmlRegex = /```html([\s\(\S\)]*?)```/i;
            const match = text.match(htmlRegex);
            
            if (match && match[1]) {
                const codeToRender = match[1].trim();
                const doc = previewFrame.contentWindow.document;
                doc.open();
                doc.write(codeToRender);
                doc.close();
            }
        }

        function clearPreview() {
            previewFrame.src = "about:blank";
        }
    </script>
</body>
</html>
